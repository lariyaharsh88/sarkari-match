name: daily refresh
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python scripts/refresh.py --limit 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python evals/run_matcher_eval.py || true
      - run: python scripts/metrics_snapshot.py
      - name: commit data
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data/notifications.json data/ledger.json docs/metrics-log.csv evals/results
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git pull --rebase origin main   # code may have been pushed while the refresh ran
          git push
      - name: open an issue on failure (GitHub emails you)
        if: ${{ failure() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$GITHUB_WORKFLOW failed $(date -u +%F)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --assignee "$GITHUB_REPOSITORY_OWNER" || true
