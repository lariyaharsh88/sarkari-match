name: extraction eval
on: { workflow_dispatch: {} }
jobs:
  eval:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python scripts/predict_gold.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python evals/run_extraction_eval.py | tee eval.txt
      - name: commit predictions and results
        run: |
          git config user.name "eval-bot"; git config user.email "eval-bot@users.noreply.github.com"
          git add evals/predictions evals/results
          git diff --cached --quiet || git commit -m "eval: extraction results $(date -u +%F)"
          git pull --rebase origin main && git push
