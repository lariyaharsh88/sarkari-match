name: deploy to cloudflare
on:
  push:
    branches: [main]
    paths: ["cf/**", "web/**", "engine/**", "pipeline/**", "data/notifications.json", ".github/workflows/deploy.yml"]
  workflow_run:
    workflows: ["daily refresh"]
    types: [completed]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # workflow_run would otherwise check out the commit before the refresh bot's push
      - uses: astral-sh/setup-uv@v6
      - run: ./build.sh
        working-directory: cf
      - run: uv run pywrangler deploy
        working-directory: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: email subscribers about the fresh data
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ -z "$URL" ]; then echo "ALERTS_DISPATCH_URL not set, skipping"; exit 0; fi
          sleep 20
          curl -fsS -X POST "$URL" -H "Authorization: Bearer $SECRET" || echo "dispatch failed"
        env:
          URL: ${{ secrets.ALERTS_DISPATCH_URL }}
          SECRET: ${{ secrets.ALERTS_CRON_SECRET }}
