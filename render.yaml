# One-click deploy on Render (free web service). Import this repo at https://dashboard.render.com/select-repo
services:
  - type: web
    name: sarkari-match
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GEMINI_API_KEY
        sync: false          # paste in the Render dashboard; sample data works without it
      - key: SITE_URL
        sync: false          # set to the Render URL after first deploy
      # Paid alerts (demo mode while Razorpay keys are blank)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERTS_TOKEN_SECRET
        generateValue: true
      - key: ALERTS_CRON_SECRET
        generateValue: true
      # The free plan has no persistent disk: subscribers.json is wiped on every deploy.
      # Before taking real payments, switch to plan: starter, add a disk mounted at /var/data,
      # and uncomment:
      # - key: SUBSCRIBERS_FILE
      #   value: /var/data/subscribers.json
